<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" fill="none">
  <defs>
    <linearGradient id="bgCNY" x1="0" y1="0" x2="800" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="260" rx="22" fill="url(#bgCNY)"/>

  <!-- Gold Corner Frame Motifs -->
  <rect x="14" y="14" width="772" height="232" rx="16" stroke="#facc15" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Left Hanging Red Chinese Lanterns & Angpao -->
  <g transform="translate(65, 16)">
    <!-- Lantern 1 -->
    <line x1="45" y1="0" x2="45" y2="24" stroke="#facc15" stroke-width="3"/>
    <ellipse cx="45" cy="54" rx="34" ry="28" fill="#ef4444" stroke="#facc15" stroke-width="3"/>
    <rect x="33" y="22" width="24" height="6" rx="2" fill="#facc15"/>
    <rect x="33" y="80" width="24" height="6" rx="2" fill="#facc15"/>
    <line x1="41" y1="86" x2="41" y2="112" stroke="#facc15" stroke-width="2.5"/>
    <line x1="49" y1="86" x2="49" y2="112" stroke="#facc15" stroke-width="2.5"/>

    <!-- Lucky Red Envelope (อั่งเปา) & Gold Ingot -->
    <g transform="translate(22, 128)">
      <rect x="0" y="0" width="52" height="72" rx="6" fill="#dc2626" stroke="#facc15" stroke-width="2.5" transform="rotate(-8)"/>
      <circle cx="24" cy="30" r="11" fill="#facc15"/>
      <!-- Gold Ingot (ก้อนทอง) -->
      <path d="M54 54 Q 78 36 102 54 L 94 74 H 62 Z" fill="#facc15" stroke="#fef08a" stroke-width="2"/>
      <ellipse cx="78" cy="48" rx="14" ry="8" fill="#fef08a"/>
    </g>
  </g>

  <!-- Right Steaming Dim Sum Bamboo Basket & Mandarin Oranges -->
  <g transform="translate(580, 68)">
    <!-- Hanging Lantern Right -->
    <line x1="115" y1="-52" x2="115" y2="-28" stroke="#facc15" stroke-width="3"/>
    <ellipse cx="115" cy="2" rx="30" ry="24" fill="#ef4444" stroke="#facc15" stroke-width="3"/>
    <rect x="104" y="24" width="22" height="5" rx="2" fill="#facc15"/>

    <!-- Dim Sum Steamer -->
    <ellipse cx="68" cy="116" rx="58" ry="26" fill="#d97706" stroke="#fde047" stroke-width="3"/>
    <ellipse cx="68" cy="106" rx="52" ry="20" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
    <!-- Steamed Buns (ซาลาเปา/ฮะเก๋า) -->
    <circle cx="48" cy="102" r="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="48" cy="99" r="3" fill="#ef4444"/>
    <circle cx="84" cy="100" r="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="84" cy="97" r="3" fill="#ef4444"/>
    <circle cx="66" cy="112" r="14" fill="#fde047" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Lucky Oranges (ส้มมงคล) -->
    <circle cx="128" cy="128" r="16" fill="#f97316" stroke="#fef08a" stroke-width="2"/>
    <circle cx="148" cy="134" r="15" fill="#fb923c" stroke="#fef08a" stroke-width="2"/>
  </g>

  <!-- Center Festival Title -->
  <g transform="translate(400, 132)" text-anchor="middle">
    <rect x="-175" y="-54" width="350" height="32" rx="16" fill="#7f1d1d" stroke="#facc15" stroke-width="1.5"/>
    <text x="0" y="-33" fill="#fef08a" font-family="Mitr, Prompt, sans-serif" font-size="14" font-weight="600" letter-spacing="1">🧧 CHINESE NEW YEAR BANQUET</text>
    <text x="0" y="8" fill="#fef08a" font-family="Mitr, Prompt, sans-serif" font-size="33" font-weight="700">เทศกาลตรุษจีน SPU</text>
    <text x="0" y="38" fill="#fecaca" font-family="Prompt, sans-serif" font-size="15" font-weight="500">ซินเจียยู่อี่ ซินนี้ฮวดไช้ อิ่มอร่อยเมนูมงคลรับโชคลาภและความเฮง</text>
  </g>
</svg>
