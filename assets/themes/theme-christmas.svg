<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" fill="none">
  <defs>
    <linearGradient id="bgXmas" x1="0" y1="0" x2="800" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="48%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="260" rx="22" fill="url(#bgXmas)"/>

  <!-- Snowflakes -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="80" cy="42" r="4"/>
    <circle cx="165" cy="70" r="3"/>
    <circle cx="240" cy="36" r="5"/>
    <circle cx="545" cy="40" r="4"/>
    <circle cx="640" cy="65" r="3.5"/>
    <circle cx="725" cy="38" r="5"/>
    <circle cx="48" cy="145" r="3.5"/>
    <circle cx="752" cy="148" r="4"/>
  </g>

  <!-- Snowy Ground Hills -->
  <path d="M0 212 Q 200 194 400 214 T 800 206 V 260 H 0 Z" fill="#f8fafc" fill-opacity="0.92"/>

  <!-- Left Decorated Christmas Tree & Gift -->
  <g transform="translate(65, 36)">
    <rect x="52" y="152" width="18" height="28" rx="3" fill="#78350f"/>
    <polygon points="61,20 15,92 107,92" fill="#15803d" stroke="#86efac" stroke-width="2"/>
    <polygon points="61,58 8,132 114,132" fill="#16a34a" stroke="#86efac" stroke-width="2"/>
    <polygon points="61,95 2,162 120,162" fill="#15803d" stroke="#86efac" stroke-width="2"/>
    <!-- Star Topper -->
    <polygon points="61,2 66,14 78,14 68,21 72,32 61,25 50,32 54,21 44,14 56,14" fill="#facc15"/>
    <!-- Ornaments -->
    <circle cx="46" cy="82" r="6" fill="#ef4444"/>
    <circle cx="74" cy="116" r="6" fill="#facc15"/>
    <circle cx="40" cy="142" r="6.5" fill="#facc15"/>
    <circle cx="82" cy="148" r="6.5" fill="#ef4444"/>
    <!-- Gift Box -->
    <rect x="96" y="142" width="38" height="36" rx="5" fill="#dc2626" stroke="#fef08a" stroke-width="2"/>
    <rect x="111" y="142" width="8" height="36" fill="#facc15"/>
    <rect x="96" y="156" width="38" height="8" fill="#facc15"/>
  </g>

  <!-- Right Festive Feast Platter & Hot Cocoa -->
  <g transform="translate(585, 76)">
    <ellipse cx="75" cy="108" rx="68" ry="26" fill="#ffffff" stroke="#facc15" stroke-width="4"/>
    <path d="M35 102 C35 62 115 62 115 102 Z" fill="#d97706" stroke="#fef3c7" stroke-width="2.5"/>
    <circle cx="48" cy="110" r="7" fill="#16a34a"/>
    <circle cx="64" cy="113" r="7" fill="#dc2626"/>
    <circle cx="86" cy="112" r="7" fill="#16a34a"/>
    <circle cx="102" cy="109" r="7" fill="#dc2626"/>
    <!-- Santa Hat on Corner -->
    <path d="M90 36 L138 66 L82 68 Z" fill="#dc2626"/>
    <rect x="78" y="64" width="64" height="12" rx="6" fill="#ffffff"/>
    <circle cx="90" cy="36" r="9" fill="#ffffff"/>
  </g>

  <!-- Center Festival Title -->
  <g transform="translate(400, 128)" text-anchor="middle">
    <rect x="-175" y="-54" width="350" height="32" rx="16" fill="#dc2626" stroke="#fef08a" stroke-width="1.5"/>
    <text x="0" y="-33" fill="#fef08a" font-family="Mitr, Prompt, sans-serif" font-size="14" font-weight="600" letter-spacing="1">🎄 CHRISTMAS &amp; NEW YEAR FEAST</text>
    <text x="0" y="8" fill="#ffffff" font-family="Mitr, Prompt, sans-serif" font-size="32" font-weight="700">คริสต์มาส &amp; ปีใหม่ SPU</text>
    <text x="0" y="38" fill="#dcfce7" font-family="Prompt, sans-serif" font-size="15" font-weight="500">ฉลองเทศกาลแห่งความสุข อิ่มอร่อยเมนูพิเศษต้อนรับลมหนาวและปีใหม่</text>
  </g>
</svg>
